name: Update Korea Briefing RSS & Sync to Notion

on:
  schedule:
    # 한국 시간(KST) 매일 아침 06:00 (UTC 21:00) 정기 실행
    - cron: '15 21 * * *'
  workflow_dispatch: # Actions 탭에서 수동 즉시 실행 지원

permissions:
  contents: write # feed.xml 푸시를 위한 쓰기 권한

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -----------------------------------------------------------------
      # 1단계: 대한민국 정책브리핑 크롤링 -> feed.xml 생성 및 깃 푸시
      # -----------------------------------------------------------------
      - name: Playwright 및 RSS 스크레이퍼 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests pytz
          playwright install --with-deps chromium

      - name: main.py 실행 (보도자료 수집 및 feed.xml 갱신)
        run: |
          python main.py

      - name: feed.xml 변경사항 저장소 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add feed.xml
          
          if ! git diff --staged --quiet; then
            echo "새로운 보도자료 피드를 저장소에 반영합니다."
            git commit -m "Auto update RSS feed [$(date '+%Y-%m-%d %H:%M:%S')]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "피드에 변경사항이 없어 커밋을 건너뜁니다."
          fi

      # -----------------------------------------------------------------
      # 2단계: 최신 feed.xml 기반 -> 노션(Notion) 데이터베이스 적재
      # -----------------------------------------------------------------
      - name: 노션 연동 및 텍스트 파싱 패키지 설치
        run: |
          pip install notion-client python-dateutil feedparser

      - name: notion_collector.py 실행 (노션 적재)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: |
          python notion_collector.py
