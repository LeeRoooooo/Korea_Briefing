name: Update Korea Briefing RSS

on:
  schedule:
    # 한국 시간 기준 매일 오전 06:00 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 필요 시 수동 즉시 실행 지원

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- [1단계: 기존 RSS 수집 및 배포 파이프라인] ---
      - name: 기존 스크레이퍼 패키지 설치
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium --with-deps

      - name: 대한민국 정책브리핑 크롤링 및 feed.xml 생성
        run: |
          python main.py

      - name: 생성된 feed.xml 저장소에 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update Korea Briefing RSS feed [skip ci]" && git push)

      # --- [2단계: 노션 데이터베이스 보도자료 적재 파이프라인] ---
      - name: 노션 및 원문 파싱 패키지 설치
        run: |
          pip install notion-client pypdf python-dateutil feedparser

      - name: 노션 보도자료 자동 적재 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: |
          python notion_collector.py
