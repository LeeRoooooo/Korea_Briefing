name: Update Korea Briefing RSS

on:
  workflow_dispatch: # 필요할 때 수동 실행 가능
  schedule:
    - cron: '0 * * * *' # 매시간 1회 실행

permissions:
  contents: write # feed.xml 푸시를 위한 쓰기 권한

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 패키지 및 브라우저 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytz
          playwright install --with-deps chromium

      - name: 보도자료 스크래핑 및 피드 갱신
        run: |
          # 파이썬 스크립트 파일명(main.py)에 맞춰 실행합니다.
          python main.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Auto update RSS feed [$(date '+%Y-%m-%d %H:%M:%S')]" || exit 0
          git push
