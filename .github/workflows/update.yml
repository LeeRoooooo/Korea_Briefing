name: Update Korea Briefing RSS

on:
  schedule:
    # 1시간마다 정각 실행 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch: # Actions 탭에서 수동 즉시 실행 가능

permissions:
  contents: write # feed.xml 푸시를 위한 쓰기 권한

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 및 Playwright Chromium 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytz
          # [핵심] 리눅스 러너에 필요한 크로미엄 실행 바이너리와 시스템 라이브러리 강제 설치
          playwright install --with-deps chromium

      - name: 보도자료 스크래핑 및 피드 갱신
        run: |
          python main.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add feed.xml
          
          # 변경사항이 있을 때만 안전하게 커밋 & 푸시 (충돌 방지 rebase 포함)
          if ! git diff --staged --quiet; then
            echo "새로운 보도자료가 감지되어 피드를 갱신합니다."
            git commit -m "Auto update RSS feed [$(date '+%Y-%m-%d %H:%M:%S')]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "피드에 새로운 변경사항이 없어 커밋을 건너뜁니다."
          fi
