name: Update Korea Briefing RSS & Sync to Notion

on:
  schedule:
    # 한국 시간(KST) 기준 매일 오전 06:00 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 필요 시 Actions 탭에서 수동 즉시 실행

jobs:
  update-and-sync:
    runs-on: ubuntu-latest

    # Git 푸시 권한 명시 (403 Permission Denied 방지)
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -------------------------------------------------------------
      # 1단계: Playwright 캐시 설정 및 패키지 설치 (시간 단축)
      # -------------------------------------------------------------
      - name: Playwright 브라우저 바이너리 캐시 확인
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/main.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 기본 스크레이퍼 패키지 설치
        run: |
          pip install playwright beautifulsoup4 requests

      # 캐시가 일치하지 않을 때만 전체 브라우저 및 OS 의존성 다운로드 실행
      - name: Playwright Chromium 브라우저 설치 (캐시 미적용 시에만 구동)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium --with-deps

      - name: main.py 실행 (대한민국 정책브리핑 수집 및 feed.xml 갱신)
        run: |
          python main.py

      - name: feed.xml 변경사항 저장소에 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update Korea Briefing RSS feed [skip ci]" && git push)

      # -------------------------------------------------------------
      # 2단계: 모바일 본문 파싱 -> Notion 데이터베이스 적재
      # -------------------------------------------------------------
      - name: 노션 연동 및 텍스트 파싱 패키지 설치
        run: |
          pip install notion-client python-dateutil feedparser requests beautifulsoup4 curl_cffi

      - name: notion_collector.py 실행 (노션 데이터베이스 적재)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: |
          python notion_collector.py
